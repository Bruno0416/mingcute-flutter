name: Regenerate screenshots

# Manual only. Regenerates the preview screenshots and uploads them as an
# artifact for review; nothing is committed or pushed by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Build the preview and capture screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Chromium for Playwright
        run: cd tool/screenshot_capture && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Capture
        run: bash tool/generate_screenshots.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-${{ github.sha }}
          path: doc/assets/screenshots/
          retention-days: 14
