name: Upstream sync

# Weekly check of the public MingCute SVG repository. The upstream tree is
# processed only as data (parsed by tool/sync_icons.py); none of its code is
# ever executed. This workflow never publishes and never changes the version.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch upstream, regenerate and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      revision: ${{ steps.diff.outputs.revision }}
      checks: ${{ steps.verify.outputs.checks }}
      exit_code: ${{ steps.verify.outputs.exit_code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Regenerate from a fresh upstream clone (automatic fetch)
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tool/requirements.txt
          .venv/bin/python tool/audit_upstream.py
          .venv/bin/python tool/sync_icons.py --min-icons 2200
          .venv/bin/python tool/readme_metadata.py --refresh-latest --write
          .venv/bin/python tool/validate.py --min-icons 2200
      - name: Compare with the committed baseline
        id: diff
        run: |
          set -euo pipefail
          git add --intent-to-add --all -- assets lib preview/lib README.md tool/upstream_status.json tool/manifest.json tool/codepoints.json tool/last_sync_report.json
          # last_sync_report.json always changes (timestamps/skip flags), so it never decides alone.
          if git diff --quiet -- assets lib preview/lib README.md tool/upstream_status.json tool/manifest.json tool/codepoints.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Upstream is identical to the committed baseline: nothing to do.'
          else
            git diff --binary -- assets lib preview/lib README.md tool/upstream_status.json tool/manifest.json tool/codepoints.json tool/last_sync_report.json > "$RUNNER_TEMP/upstream.patch"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$(.venv/bin/python -c "import json;print(json.load(open('tool/manifest.json'))['sourceRevision'])")" >> "$GITHUB_OUTPUT"
      - name: Verify the regenerated tree (analysis and tests)
        id: verify
        if: steps.diff.outputs.changed == 'true'
        run: |
          # A failing check must not stop the proposal (reviewers need the diff) but it must
          # never be hidden: the status and log travel into the PR, which is then a draft.
          set +e
          bash tool/check.sh 2>&1 | tee "$RUNNER_TEMP/check.log"
          code="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then echo 'checks=pass' >> "$GITHUB_OUTPUT"; else echo 'checks=fail' >> "$GITHUB_OUTPUT"; fi
          echo "tool/check.sh exit code: $code" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the proposed change and the check log
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-patch
          path: |
            ${{ runner.temp }}/upstream.patch
            ${{ runner.temp }}/check.log
          retention-days: 7

  propose:
    name: Open a review pull request
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REVISION: ${{ needs.sync.outputs.revision }}
      CHECKS: ${{ needs.sync.outputs.checks }}
      CHECK_EXIT: ${{ needs.sync.outputs.exit_code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-patch
          path: ${{ runner.temp }}/patch
      - name: Commit the generated change to a review branch
        run: |
          set -euo pipefail
          branch="automation/upstream-${REVISION:0:12}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$branch"
          git apply --index "$RUNNER_TEMP/patch/upstream.patch"
          git commit --message "chore: sync MingCute upstream ${REVISION:0:12}"
          git push --force-with-lease origin "$branch"
          {
            if [ "$CHECKS" != pass ]; then
              echo "> **CHECKS FAILED (tool/check.sh exit code $CHECK_EXIT). DO NOT MERGE until this is fixed.**"
              echo '> This pull request is a draft on purpose; nothing is merged or published automatically.'
              echo
            fi
            echo '## Upstream sync (generated)'
            echo
            echo "Upstream revision: \`$REVISION\`. Local verification: **${CHECKS^^}**."
            echo
            echo 'Review the added/removed/modified icons in tool/last_sync_report.json,'
            echo 'check optical parity, licence notes and the generated README versions/counts;'
            echo 'regenerate screenshots if needed. Removed icons keep their codepoints'
            echo '(append-only ledger). This PR changes neither the version nor the CHANGELOG.'
            echo
            echo 'Checks are started with workflow_dispatch on this branch because pushes made with'
            echo 'GITHUB_TOKEN do not trigger workflows; verify that the run is for the final SHA.'
            if [ "$CHECKS" != pass ]; then
              echo
              echo '<details><summary>Last lines of the failing check log</summary>'
              echo
              echo '```'
              tail -n 60 "$RUNNER_TEMP/patch/check.log"
              echo '```'
              echo '</details>'
            fi
          } > "$RUNNER_TEMP/body.md"
          title="Sync MingCute upstream ${REVISION:0:12}"
          draft=()
          if [ "$CHECKS" != pass ]; then title="[CHECKS FAILING] $title"; draft=(--draft); fi
          gh pr create --base main --head "$branch" --title "$title" "${draft[@]}" --body-file "$RUNNER_TEMP/body.md" \
            || gh pr edit "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          gh workflow run ci.yml --ref "$branch"
