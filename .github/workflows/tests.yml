name: Tests and analysis

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests, analysis and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Install Python tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tool/requirements.txt
      - name: Pipeline, automation and publication safeguards
        run: |
          .venv/bin/python -m unittest discover -s tool/tests -p 'test_*.py' -v
          .venv/bin/python -m unittest discover -s tool/ci/tests -p 'test_*.py' -v
          .venv/bin/python tool/validate.py --min-icons 2200
      - name: Resolve package and preview before formatting
        run: flutter pub get && (cd preview && flutter pub get)
      - name: Validate Dart formatting
        run: dart format --output=none --set-exit-if-changed lib example/lib preview/lib preview/test test
      - name: Analyze and test the package and preview
        run: bash tool/check.sh
      - name: Build the preview for Web
        run: cd preview && flutter build web --release --no-web-resources-cdn
      - name: Primary API functional contract (subsetting recorded, not claimed)
        run: .venv/bin/python tool/verify_consumer.py --report "$RUNNER_TEMP/consumer-primary.json" --scenario primary-contract
      - name: Static API mandatory unused-glyph subsetting
        run: .venv/bin/python tool/verify_consumer.py --report "$RUNNER_TEMP/consumer-static.json" --scenario static-subsetting
      - name: Mixed API functional contract and retention measurement
        run: .venv/bin/python tool/verify_consumer.py --report "$RUNNER_TEMP/consumer-mixed.json" --scenario mixed-contract
      - name: Retain consumer evidence even when subsetting fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-evidence-${{ github.sha }}-${{ github.event_name }}
          path: |
            ${{ runner.temp }}/consumer-*.json
            ${{ runner.temp }}/consumer-*.log
          if-no-files-found: warn
          retention-days: 7

  rebuild:
    name: Reproducible SVG to font rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rebuild every glyph in an isolated sandbox
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tool/requirements.txt
          .venv/bin/python tool/verify_rebuild.py
